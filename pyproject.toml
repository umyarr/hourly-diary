[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hourly-diary"
version = "0.1.0"
description = "Private Telegram hourly diary with durable SQLite storage"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "aiohttp>=3.9,<4",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
hourly-diary = "hourly_diary.__main__:main"

[tool.setuptools.packages.find]
include = ["hourly_diary*"]
exclude = ["tests*", "tools*", "assets*"]
